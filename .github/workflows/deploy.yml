name: Deploy to Hetzner

on:
  push:
    branches: [main]

# The 'Open issue on failure' step needs issues:write; checkout needs contents:read.
# Without this block the default token is read-only and the alert step 500s with
# "Resource not accessible by integration".
permissions:
  contents: read
  issues: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # A broken UI still builds cleanly and still returns 200 from /api/health, so the
      # backend health check cannot catch it. These tests load the built bundle in a real
      # browser and assert the shell is intact — they gate the deploy.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built frontend
        working-directory: frontend
        run: npm run test:smoke

      - name: Upload smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and test
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q

  deploy:
    needs: [build-check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 91.98.46.215
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/assistant
            git fetch origin main
            git reset --hard origin/main
            /opt/assistant/backend/venv/bin/pip install -r backend/requirements.txt
            cd frontend
            npm install --prefer-offline
            npm run build
            systemctl restart assistant
            echo "Deploy complete"

      - name: Health check
        run: |
          echo "Waiting for service to come up..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mcgreeff-assistant.duckdns.org/api/health || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after 10 attempts — service is not responding."
          exit 1

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Bad gateway after deploy (run ${context.runId})`,
              body: `The post-deploy health check failed — the app returned a non-200 response after 10 attempts (30 seconds).\n\n**Action run:** ${run_url}\n**Commit:** ${context.sha}\n\nThe systemd \`assistant\` service likely crashed on startup. SSH in and check:\n\`\`\`\nssh root@91.98.46.215\njournalctl -u assistant -n 50\nsystemctl status assistant\n\`\`\``,
            });
